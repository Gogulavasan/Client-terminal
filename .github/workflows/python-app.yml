# CI: syntax-check and smoke-test the tracker CLI on every push.
# Runs on the 24h scanner's pushes too, so it must stay fast and quiet
# (a failing job would email the owner on every scan).

name: Tracker smoke test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Syntax / undefined-name check
      run: |
        python -m pip install --quiet flake8
        python -m py_compile crt.py
        flake8 crt.py --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Smoke-test crt.py (add -> list -> due -> pipeline -> export)
      run: |
        set -e
        python crt.py add --company "CI Smoke Mall" --type mall --city Bengaluru --state KA \
          --source "https://example.invalid" --trigger "CI run" --score 75 --products photo_booth
        python crt.py list --hot | grep -q "CI Smoke Mall"
        python crt.py find "smoke" | grep -q "CRT-"
        python crt.py due
        python crt.py pipeline > /dev/null
        python crt.py export --csv /tmp/ci.csv
        test -s /tmp/ci.csv
        # leave the repo exactly as it was
        git checkout -- data/leads.json
        git checkout -- PIPELINE.md 2>/dev/null || rm -f PIPELINE.md
        echo "smoke test passed"
